services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Definí SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - db_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - media_data:/media:ro
      - static_data:/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  media_data:
  static_data:
