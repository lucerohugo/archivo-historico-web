# CloudPanel termina el HTTPS y llega acá por http: conservar el esquema original
# (si no viene el header, usar el de esta conexión)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    location /static/ {
        alias /static/;
    }

    # Los adjuntos NO se sirven directo: Django controla el acceso en
    # /api/archivos/<id>/ver/ y responde con X-Accel-Redirect hacia esta location
    location /protected-media/ {
        internal;
        alias /media/;
    }

    # Solo los logos son públicos
    location /media/logos/ {
        alias /media/logos/;
    }

    location ~ ^/(api|django-admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
